    <title>MediSub - Your Medical Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            },
            colors: {
              medisub: {
                primary: '#2563eb',    // blue-600
                dark: '#1e40af',       // blue-800
                secondary: '#0ea5e9',  // sky-500
                accent: '#f59e0b',     // amber-500
                slate: '#1e293b'       // slate-800
              }
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out',
              'slide-right': 'slideRight 1.5s ease-in-out infinite',
              'slide-down': 'slideDown 1.5s ease-in-out infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(30px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideRight: {
                '0%, 100%': { transform: 'translateX(0)', opacity: '0.6' },
                '50%': { transform: 'translateX(10px)', opacity: '1' },
              },
              slideDown: {
                 '0%, 100%': { transform: 'rotate(90deg) translateX(0)', opacity: '0.6' },
                 '50%': { transform: 'rotate(90deg) translateX(10px)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
      }
    </style>
