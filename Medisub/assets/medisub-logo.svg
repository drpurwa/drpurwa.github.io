<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" role="img" aria-label="MediSub logo">
  <defs>
    <linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#4aa6e8"/>
      <stop offset="100%" stop-color="#2b59a6"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
